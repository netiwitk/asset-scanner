<!DOCTYPE html>
<html lang="th">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="สแกน QR ทรัพย์สิน คู่กับระบบ asset-laravel">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="สแกนทรัพย์สิน">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>สแกนทรัพย์สิน</title>
  <meta name="theme-color" content="#2563EB">
  <style>
    body { margin: 0; background: #F8FAFC; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 16px system-ui, sans-serif; color: #475569; }
    @media (prefers-color-scheme: dark) { body { background: #0F172A; } #loading { color: #94A3B8; } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- The app is a few MB; say something until Flutter draws its first frame. -->
  <div id="loading">กำลังเปิดแอปสแกนทรัพย์สิน…</div>
  <script>window.addEventListener("flutter-first-frame", () => document.getElementById("loading").remove());</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
