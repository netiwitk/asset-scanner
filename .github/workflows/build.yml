name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The portfolio demo: the web app on GitHub Pages, with the Android APK as a download beside it.
  pages:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /asset-scanner/ --dart-define=DEMO=true
      # Signed with the debug key from Flutter's template: fine for a demo download, not for the Play Store.
      # arm64 only: the all-in-one APK is ~68 MB, and practically every phone in use is arm64.
      - run: flutter build apk --release --split-per-abi --dart-define=DEMO=true
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/web/asset-scanner.apk
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v5
